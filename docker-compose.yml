services:
  app:
    build: .
    container_name: wakeup-builders
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3016"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "mysql://root:quantumSql%40123@host.docker.internal:3306/wakeup_builders"
      SEED_PASSWORD: "Admin@12345"
    ports:
      - "3016:3016"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - wakeup_uploads:/app/public/uploads
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3016/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  wakeup_uploads:
